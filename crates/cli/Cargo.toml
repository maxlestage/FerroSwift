[package]
name = "ferroswift-cli"
description = "The ferroswift command: translate a Rust crate into Swift and SwiftUI, watch it, scaffold a new app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["swift", "swiftui", "ios", "cli", "transpiler"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ferroswift"
path = "src/main.rs"

[dependencies]
ferroswift-transpiler = { version = "0.1.0", path = "../transpiler" }
