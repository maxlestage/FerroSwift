[package]
name = "ferroswift-site"
description = "Presentation site, documentation and live playground of FerroSwift, written with active."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
# `examples/*.rs` are the playground's Rust sources (read with `include_str!`), not cargo
# examples.
autoexamples = false

# The library holds what the server and the browser share (routes, highlighter, the
# playground island) and, compiled to WebAssembly, the browser bundle. The binary is the
# static generator and the development server.
[lib]
name = "ferroswift_site"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ferroswift-site"
path = "src/main.rs"

[dependencies]
active = { git = "https://github.com/maxlestage/Active" }
ferroswift-transpiler = { path = "../crates/transpiler" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
active = { git = "https://github.com/maxlestage/Active", features = ["client"] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = [
  "Clipboard",
  "console",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "History",
  "HtmlDocument",
  "HtmlElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "Navigator",
  "Performance",
  "Window",
] }
