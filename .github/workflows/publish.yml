# Publishes the four crates on crates.io, in dependency order, when a tag `vX.Y.Z` is pushed
# or a GitHub release is published (from a phone: Releases → Draft a new release → tag
# v0.1.0 → Publish release), or by hand from the Actions tab (a dry run by default).
#
# Setup: repository secret CARGO_REGISTRY_TOKEN, a crates.io API token with the
# publish-new and publish-update scopes (crates.io → Account Settings → API Tokens).
# A crate whose version is already on crates.io is skipped, so re-running is safe.

name: Publish crates

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only package and verify, do not upload"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ferroswift") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version: bump version in Cargo.toml first."
            exit 1
          fi

      # The Rust side of the tests; the Swift comparisons run in CI with swiftc.
      - run: cargo test --workspace

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: cargo publish --workspace --dry-run

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Add the CARGO_REGISTRY_TOKEN secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ferroswift") | .version')
          for crate in ferroswift-macros ferroswift-transpiler ferroswift ferroswift-cli; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "ferroswift-release (github.com/${GITHUB_REPOSITORY})" \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            if [ "$status" = "200" ]; then
              echo "${crate} ${version} is already on crates.io, skipping"
            else
              cargo publish -p "${crate}"
            fi
          done
          echo "### 📦 Published FerroSwift ${version}: https://crates.io/crates/ferroswift/${version}" >> "$GITHUB_STEP_SUMMARY"
