[workspace]
resolver = "2"
members = [
  "crates/ferroswift",
  "crates/macros",
  "crates/transpiler",
  "crates/cli",
  "site",
  "examples/counter",
  "examples/todo",
  "examples/showcase",
  "examples/gallery",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
homepage = "https://maxlestage.github.io/FerroSwift/"
authors = ["Maxime Nathan Lestage"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The site's browser bundle (the live playground): `cargo build --profile wasm-release --target wasm32-unknown-unknown`.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
panic = "abort"
